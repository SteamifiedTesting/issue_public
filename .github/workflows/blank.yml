name: Test cross repo access
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Try listing issues from private repo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.listForRepo({
              owner: 'SteamifiedTesting',
              repo: 'issue_private',
              per_page: 1
            });
            console.log("✅ Cross-repo access works!");
