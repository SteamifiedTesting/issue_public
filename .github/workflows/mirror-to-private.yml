name: Mirror new issues to private (by type)

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

env:
  ISSUE_TYPE_TO_MIRROR: "Epic"   # ✅ Edit this once to control type

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}

    steps:
      - name: Mirror to private repo if type matches
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_MIRROR_TOKEN }}
          script: |
            const pubIssue = context.payload.issue;
            const pubOwner = context.repo.owner;
            const pubRepo  = context.repo.repo;
            const privateOwner = 'SteamifiedTesting';
            const privateRepo  = 'issue_private';
            const requiredType = process.env.ISSUE_TYPE_TO_MIRROR;

            // 1️⃣ Fetch Issue Type via GraphQL
            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    issueType { name }
                  }
                }
              }
            `;
            const res = await github.graphql(query, {
              owner: pubOwner,
              repo: pubRepo,
              number: pubIssue.number,
            });
            const issueTypeName = res.repository.issue?.issueType?.name || null;
            core.info(`🧩 Issue Type detected: ${issueTypeName}`);

            // 2️⃣ Skip unless it matches configured type
            if (issueTypeName !== requiredType) {
              core.info(`⏭️ Not a ${requiredType} — skipping mirror.`);
              return;
            }

            // 3️⃣ Create twin issue in PRIVATE repo
            const created = await github.rest.issues.create({
              owner: privateOwner,
              repo: privateRepo,
              title: pubIssue.title,
              body: `${pubIssue.body || ''}\n\n<!-- mirrored-from: ${pubOwner}/${pubRepo}#${pubIssue.number} -->`,
            });

            // 4️⃣ Add hidden mapping marker to PUBLIC issue
            const marker = `<!-- mirrored-to: ${privateOwner}/${privateRepo}#${created.data.number} -->`;
            await github.rest.issues.update({
              owner: pubOwner,
              repo: pubRepo,
              issue_number: pubIssue.number,
              body: `${pubIssue.body || ''}\n\n${marker}`,
            });

            core.info(`✅ Mirrored ${requiredType} ${pubOwner}/${pubRepo}#${pubIssue.number} → ${privateRepo}#${created.data.number}`);
