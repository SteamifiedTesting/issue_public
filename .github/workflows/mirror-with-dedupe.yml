name: Mirror new issues to private (with dedupe, no label clutter)

on:
  issues:
    types: [opened] # add "edited" if you also want dedupe on edits

permissions:
  contents: read
  issues: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}

    steps:
      # --- Step 1: Dedupe in PUBLIC using a hidden marker in the body (no per-issue labels)
      - name: Dedupe in public repo (close new duplicates)
        id: dedupe
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_MIRROR_TOKEN }}
          script: |
            const crypto = require('crypto');
            const pubIssue = context.payload.issue;
            const owner = context.repo.owner; // e.g., SteamifiedTesting
            const repo  = context.repo.repo;  // e.g., issue_public

            // Normalize to catch near-identical duplicates
            const normalize = (s) =>
              (s || '')
                .replace(/\r\n/g, '\n')
                .replace(/[ \t]+/g, ' ')
                .replace(/\n{3,}/g, '\n\n')
                .trim()
                .toLowerCase();

            const title = normalize(pubIssue.title);
            const body  = normalize(pubIssue.body);

            // Fingerprint (title + body). For title-only, change the input to update(title)
            const fp = crypto.createHash('sha256').update(`${title}\n---\n${body}`).digest('hex').slice(0,16);
            const dedupeMarker = `<!-- dedupe-key:${fp} -->`;

            // Search other issues in this repo that already contain this marker
            const q = `repo:${owner}/${repo} is:issue in:body "dedupe-key:${fp}"`;
            const res = await github.rest.search.issuesAndPullRequests({ q });

            // Find an existing issue that is NOT this newly opened one
            const existing = (res.data.items || []).find(i => i.number !== pubIssue.number);

            if (!existing) {
              // First occurrence -> mark canonical (optional label) and append hidden marker to body
              const currentBody = pubIssue.body || '';
              if (!currentBody.includes(dedupeMarker)) {
                await github.rest.issues.update({
                  owner, repo, issue_number: pubIssue.number,
                  body: `${currentBody}\n\n${dedupeMarker}`
                });
              }
              // Optional: add a stable label to signal it's the canonical
              try {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: pubIssue.number,
                  labels: ['canonical']
                });
              } catch {}
              core.setOutput('is_duplicate', 'false');
              core.setOutput('fingerprint', fp);
            } else {
              // Duplicate -> label (fixed label only), comment, close
              try {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: pubIssue.number,
                  labels: ['duplicate']
                });
              } catch {}

              await github.rest.issues.createComment({
                owner, repo, issue_number: pubIssue.number,
                body: `This issue duplicates #${existing.number}. Please follow updates there.`
              });

              await github.rest.issues.update({
                owner, repo, issue_number: pubIssue.number,
                state: 'closed'
              });

              // Optional: notify canonical that a dup was closed
              try {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Closed duplicate: #${pubIssue.number}.`
                });
              } catch {}

              core.setOutput('is_duplicate', 'true');
              core.setOutput('fingerprint', fp);
            }

      # --- Step 2: If duplicate, stop here (don’t mirror)
      - name: Stop if this was a duplicate
        if: steps.dedupe.outputs.is_duplicate == 'true'
        run: echo "Duplicate detected; skipping mirror."

      # --- Step 3: Mirror ONLY the canonical to PRIVATE (and avoid duplicate mirrors there too)
      - name: Mirror canonical to private repo
        if: steps.dedupe.outputs.is_duplicate != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_MIRROR_TOKEN }}
          script: |
            const crypto = require('crypto');
            const pubIssue = context.payload.issue;
            const pubOwner = context.repo.owner; // e.g., SteamifiedTesting
            const pubRepo  = context.repo.repo;  // e.g., issue_public

            // --- set your private target here
            const privateOwner = 'SteamifiedTesting';
            const privateRepo  = 'issue_private';

            // Recompute the same fingerprint for a stable mirror-key
            const normalize = (s) =>
              (s || '')
                .replace(/\r\n/g, '\n')
                .replace(/[ \t]+/g, ' ')
                .replace(/\n{3,}/g, '\n\n')
                .trim()
                .toLowerCase();
            const title = normalize(pubIssue.title);
            const body  = normalize(pubIssue.body);
            const fp = crypto.createHash('sha256').update(`${title}\n---\n${body}`).digest('hex').slice(0,16);

            const mirrorKeyMarker = `<!-- mirror-key:${fp} -->`;
            const mirroredFrom    = `<!-- mirrored-from: ${pubOwner}/${pubRepo}#${pubIssue.number} -->`;
            const mirroredToPrefix = '<!-- mirrored-to:';

            // 1) Check if a mirror already exists in PRIVATE by label-free markers
            //    Prefer searching for the 'mirrored-from' marker specific to this public issue.
            const qPrivBody = `repo:${privateOwner}/${privateRepo} is:issue in:body "mirrored-from: ${pubOwner}/${pubRepo}#${pubIssue.number}"`;
            const searchPrivBody = await github.rest.search.issuesAndPullRequests({ q: qPrivBody });
            let privExisting = searchPrivBody.data.items?.[0];

            //    Fallback: search by mirror-key (same content) if needed
            if (!privExisting) {
              const qPrivKey = `repo:${privateOwner}/${privateRepo} is:issue in:body "mirror-key:${fp}"`;
              const searchPrivKey = await github.rest.search.issuesAndPullRequests({ q: qPrivKey });
              privExisting = searchPrivKey.data.items?.[0];
            }

            let privateNumber;
            if (privExisting) {
              privateNumber = privExisting.number;

              // Optional: add a small sync note
              try {
                await github.rest.issues.createComment({
                  owner: privateOwner, repo: privateRepo, issue_number: privateNumber,
                  body: `Update from origin ${pubOwner}/${pubRepo}#${pubIssue.number}.`
                });
              } catch {}
            } else {
              // 2) Create the mirror in PRIVATE (no label spam; use hidden markers in body)
              const created = await github.rest.issues.create({
                owner: privateOwner,
                repo: privateRepo,
                title: pubIssue.title,
                body: `${pubIssue.body || ''}\n\n${mirroredFrom}\n${mirrorKeyMarker}`,
                // Optional: carry over a small, fixed label set (avoid label explosion)
                labels: ['mirrored-from-public']
              });
              privateNumber = created.data.number;
            }

            // 3) Add a hidden mapping marker back to the PUBLIC issue (only once)
            const existingBody = pubIssue.body || '';
            const marker = `<!-- mirrored-to: ${privateOwner}/${privateRepo}#${privateNumber} -->`;
            if (!existingBody.includes(marker)) {
              const newBody = existingBody.includes(mirroredToPrefix)
                ? existingBody // don't duplicate multiple 'mirrored-to' markers if re-run
                : `${existingBody}\n\n${marker}`;
              await github.rest.issues.update({
                owner: pubOwner,
                repo: pubRepo,
                issue_number: pubIssue.number,
                body: newBody
              });
            }
