name: Mirror new issues to private (dedupe first, no private labels)

on:
  issues:
    types: [opened] # add "edited" if you also want dedupe on edits

permissions:
  contents: read
  issues: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}

    steps:
      # --- Deterministic dedupe: oldest matching issue is canonical
      - name: Dedupe in public (label canonical/duplicate, close duplicates)
        id: dedupe
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_MIRROR_TOKEN }}
          script: |
            const crypto = require('crypto');
            const { owner, repo } = context.repo;
            const cur = context.payload.issue;

            const normalize = (s) =>
              (s || '')
                .replace(/\r\n/g, '\n')
                .replace(/[ \t]+/g, ' ')
                .replace(/\n{3,}/g, '\n\n')
                .trim()
                .toLowerCase();

            const fpOf = (title, body) =>
              crypto.createHash('sha256')
                .update(`${normalize(title)}\n---\n${normalize(body)}`)
                .digest('hex')
                .slice(0, 16);

            const curFp = fpOf(cur.title, cur.body);
            const dedupeMarker = `<!-- dedupe-key:${curFp} -->`;

            // 1) Find potential matches quickly by title, then verify by fingerprint.
            const titleQuery = cur.title.replace(/"/g, '\\"');
            const q = `repo:${owner}/${repo} is:issue in:title "${titleQuery}"`;
            const search = await github.rest.search.issuesAndPullRequests({ q, per_page: 50 });

            // Consider ONLY older issues (smaller number). Fetch full to compute fp.
            let canonical = null;
            for (const item of (search.data.items || [])
                  .filter(i => i.number !== cur.number && !i.pull_request && i.number < cur.number)) {
              const full = await github.rest.issues.get({ owner, repo, issue_number: item.number });
              const it = full.data;
              if (fpOf(it.title, it.body) === curFp) { canonical = it; break; }
            }

            if (!canonical) {
              // This is the first occurrence -> mark canonical and append hidden key
              try {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: cur.number,
                  labels: ['canonical']
                });
              } catch {}
              const currentBody = cur.body || '';
              if (!currentBody.includes(dedupeMarker)) {
                await github.rest.issues.update({
                  owner, repo, issue_number: cur.number,
                  body: `${currentBody}\n\n${dedupeMarker}`
                });
              }
              core.setOutput('is_duplicate', 'false');
              core.setOutput('fingerprint', curFp);
            } else {
              // Duplicate -> label, comment, close the NEW one
              try {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: cur.number,
                  labels: ['duplicate']
                });
              } catch {}
              await github.rest.issues.createComment({
                owner, repo, issue_number: cur.number,
                body: `This issue duplicates #${canonical.number}. Please follow updates there.`
              });
              await github.rest.issues.update({
                owner, repo, issue_number: cur.number,
                state: 'closed'
              });
              core.setOutput('is_duplicate', 'true');
              core.setOutput('fingerprint', curFp);
            }

      - name: Stop if duplicate (do NOT mirror to private)
        if: steps.dedupe.outputs.is_duplicate == 'true'
        run: echo "Duplicate detected; mirroring skipped."

      # --- Mirror ONLY canonical to private (no labels added in private)
      - name: Mirror canonical to private (no private labels)
        if: steps.dedupe.outputs.is_duplicate != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_MIRROR_TOKEN }}
          script: |
            const crypto = require('crypto');
            const pubIssue = context.payload.issue;
            const pubOwner = context.repo.owner;
            const pubRepo  = context.repo.repo;

            // ---- set your private target here
            const privateOwner = 'SteamifiedTesting';
            const privateRepo  = 'issue_private';

            const normalize = (s) =>
              (s || '')
                .replace(/\r\n/g, '\n')
                .replace(/[ \t]+/g, ' ')
                .replace(/\n{3,}/g, '\n\n')
                .trim()
                .toLowerCase();

            const fp = crypto.createHash('sha256')
              .update(`${normalize(pubIssue.title)}\n---\n${normalize(pubIssue.body)}`)
              .digest('hex')
              .slice(0,16);

            const mirrorKeyMarker = `<!-- mirror-key:${fp} -->`;
            const mirroredFrom    = `<!-- mirrored-from: ${pubOwner}/${pubRepo}#${pubIssue.number} -->`;
            const mirroredTo      = (num) => `<!-- mirrored-to: ${privateOwner}/${privateRepo}#${num} -->`;
            const mirroredToPrefix = '<!-- mirrored-to:';

            // Prefer exact origin lookup (idempotent if re-run)
            const qPrivOrigin = `repo:${privateOwner}/${privateRepo} is:issue in:body "mirrored-from: ${pubOwner}/${pubRepo}#${pubIssue.number}"`;
            const srch1 = await github.rest.search.issuesAndPullRequests({ q: qPrivOrigin });
            let match = srch1.data.items?.[0];

            // Fallback: by content key
            if (!match) {
              const qPrivKey = `repo:${privateOwner}/${privateRepo} is:issue in:body "mirror-key:${fp}"`;
              const srch2 = await github.rest.search.issuesAndPullRequests({ q: qPrivKey });
              match = srch2.data.items?.[0];
            }

            let privateNum;
            if (match) {
              privateNum = match.number;
            } else {
              // Create mirror in PRIVATE (no labels)
              const created = await github.rest.issues.create({
                owner: privateOwner,
                repo: privateRepo,
                title: pubIssue.title,
                body: `${pubIssue.body || ''}\n\n${mirroredFrom}\n${mirrorKeyMarker}`
              });
              privateNum = created.data.number;
            }

            // Back-link once in PUBLIC (avoid duplicates)
            const existingBody = pubIssue.body || '';
            const marker = mirroredTo(privateNum);
            if (!existingBody.includes(marker)) {
              const newBody = existingBody.includes(mirroredToPrefix)
                ? existingBody
                : `${existingBody}\n\n${marker}`;
              await github.rest.issues.update({
                owner: pubOwner,
                repo: pubRepo,
                issue_number: pubIssue.number,
                body: newBody
              });
            }
