name: Mirror new issues to private (dedupe first, race-proof, no private labels)

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}

    steps:
      - name: Dedupe in public (older-number wins, retry; no premature 'canonical')
        id: dedupe
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_MIRROR_TOKEN }}
          script: |
            const crypto = require('crypto');
            const { owner, repo } = context.repo;
            const cur = context.payload.issue;

            const normalize = (s) =>
              (s || '')
                .replace(/\r\n/g, '\n')
                .replace(/[ \t]+/g, ' ')
                .replace(/\n{3,}/g, '\n\n')
                .trim()
                .toLowerCase();

            const fpOf = (title, body) =>
              crypto.createHash('sha256')
                .update(`${normalize(title)}\n---\n${normalize(body)}`)
                .digest('hex').slice(0, 16);

            const curFp = fpOf(cur.title, cur.body);
            const dedupeMarker = `<!-- dedupe-key:${curFp} -->`;

            const stripMirrorMarkers = (body) => (body || '')
              .replace(/<!--\s*mirrored-to:[\s\S]*?-->\s*/gi, '')
              .replace(/<!--\s*mirror-key:[\s\S]*?-->\s*/gi, '')
              .replace(/<!--\s*mirrored-from:[\s\S]*?-->\s*/gi, '');

            const listIssues = async (state) => github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state, per_page: 100, sort: 'created', direction: 'desc' }
            );

            // Prefer search by fp marker (covers beyond 200)
            const qKey = `repo:${owner}/${repo} is:issue in:body "dedupe-key:${curFp}"`;
            const searched = await github.rest.search.issuesAndPullRequests({ q: qKey });

            let canonical = null;
            if (searched.data.items?.length) {
              for (const it of searched.data.items) {
                if (it.pull_request) continue;
                if (it.number < cur.number) { canonical = { number: it.number }; break; }
              }
            }

            // Fallback: recent window + light retry for listing lag
            if (!canonical) {
              const openIssues   = await listIssues('open');
              const closedIssues = await listIssues('closed');
              const window = [...openIssues.slice(0, 200), ...closedIssues.slice(0, 200)];

              const findOlderCanonical = async () => {
                for (const it of window) {
                  if (it.pull_request || it.number >= cur.number) continue;
                  const full = await github.rest.issues.get({ owner, repo, issue_number: it.number });
                  const itFp = fpOf(full.data.title, full.data.body);
                  if (itFp === curFp) return full.data;
                }
                return null;
              };

              for (let attempt = 0; attempt < 3 && !canonical; attempt++) {
                canonical = await findOlderCanonical();
                if (!canonical) await new Promise(r => setTimeout(r, 2000));
              }
            }

            if (!canonical) {
              // Mark as canonical-lite: stamp hidden fp key only
              const latest = await github.rest.issues.get({ owner, repo, issue_number: cur.number });
              const body = latest.data.body || '';
              if (!body.includes(dedupeMarker)) {
                await github.rest.issues.update({
                  owner, repo, issue_number: cur.number,
                  body: `${body}\n\n${dedupeMarker}`
                });
              }
              core.setOutput('is_duplicate', 'false');
            } else {
              // DUPLICATE: label, comment, close, and STRIP any mirror markers from public
              try { await github.rest.issues.addLabels({ owner, repo, issue_number: cur.number, labels: ['duplicate'] }); } catch {}
              await github.rest.issues.createComment({
                owner, repo, issue_number: cur.number,
                body: `This issue duplicates #${canonical.number}. Please follow updates there.`
              });

              const latest = await github.rest.issues.get({ owner, repo, issue_number: cur.number });
              const cleaned = stripMirrorMarkers(latest.data.body || '');

              await github.rest.issues.update({ owner, repo, issue_number: cur.number, body: cleaned, state: 'closed' });
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: cur.number, name: 'canonical' }); } catch {}

              core.setOutput('is_duplicate', 'true');
            }

      - name: Stop if duplicate (do NOT mirror to private)
        if: steps.dedupe.outputs.is_duplicate == 'true'
        run: echo "Duplicate detected; mirroring skipped."

      - name: Mirror canonical to private (revalidate before creating)
        id: mirror_to_private
        if: steps.dedupe.outputs.is_duplicate != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_MIRROR_TOKEN }}
          script: |
            const crypto = require('crypto');
            const pubIssue = context.payload.issue;
            const pubOwner = context.repo.owner;
            const pubRepo  = context.repo.repo;

            const privateOwner = 'SteamifiedTesting';
            const privateRepo  = 'issue_private';

            const normalize = (s) =>
              (s || '')
                .replace(/\r\n/g, '\n')
                .replace(/[ \t]+/g, ' ')
                .replace(/\n{3,}/g, '\n\n')
                .trim()
                .toLowerCase();

            const fpOf = (title, body) =>
              crypto.createHash('sha256')
                .update(`${normalize(title)}\n---\n${normalize(body)}`)
                .digest('hex').slice(0, 16);

            const curFp = fpOf(pubIssue.title, pubIssue.body);
            const mirrorKeyMarker = `<!-- mirror-key:${curFp} -->`;
            const mirroredFrom    = `<!-- mirrored-from: ${pubOwner}/${pubRepo}#${pubIssue.number} -->`;
            const mirroredTo      = (num) => `<!-- mirrored-to: ${privateOwner}/${privateRepo}#${num} -->`;
            const mirroredToPrefix = '<!-- mirrored-to:';

            // Revalidate canonicality one more time (older-number wins)
            const owner = pubOwner, repo = pubRepo;
            const listIssues = async (state) => github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state, per_page: 100, sort: 'created', direction: 'desc' }
            );

            const openIssues   = await listIssues('open');
            const closedIssues = await listIssues('closed');
            let olderMatch = null;
            for (const it of [...openIssues.slice(0,200), ...closedIssues.slice(0,200)]) {
              if (it.pull_request || it.number >= pubIssue.number) continue;
              const full = await github.rest.issues.get({ owner, repo, issue_number: it.number });
              const itFp = fpOf(full.data.title, full.data.body);
              if (itFp === curFp) { olderMatch = full.data; break; }
            }

            if (olderMatch) {
              // Convert to duplicate and DO NOT mirror; also strip any mirror markers just in case
              try { await github.rest.issues.addLabels({ owner, repo, issue_number: pubIssue.number, labels: ['duplicate'] }); } catch {}
              await github.rest.issues.createComment({
                owner, repo, issue_number: pubIssue.number,
                body: `This issue duplicates #${olderMatch.number}. Please follow updates there.`
              });

              const latest = await github.rest.issues.get({ owner, repo, issue_number: pubIssue.number });
              const cleaned = (latest.data.body || '')
                .replace(/<!--\s*mirrored-to:[\s\S]*?-->\s*/gi, '')
                .replace(/<!--\s*mirror-key:[\s\S]*?-->\s*/gi, '')
                .replace(/<!--\s*mirrored-from:[\s\S]*?-->\s*/gi, '');

              await github.rest.issues.update({ owner, repo, issue_number: pubIssue.number, body: cleaned, state: 'closed' });
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: pubIssue.number, name: 'canonical' }); } catch {}

              core.setOutput('was_mirrored', 'false');
              core.setOutput('private_issue_number', '');
              return;
            }

            // Canonical → create/find private mirror (NO labels in private)
            const qPrivOrigin = `repo:${privateOwner}/${privateRepo} is:issue in:body "mirrored-from: ${pubOwner}/${pubRepo}#${pubIssue.number}"`;
            const srch1 = await github.rest.search.issuesAndPullRequests({ q: qPrivOrigin });
            let match = srch1.data.items?.[0];

            if (!match) {
              const qPrivKey = `repo:${privateOwner}/${privateRepo} is:issue in:body "mirror-key:${curFp}"`;
              const srch2 = await github.rest.search.issuesAndPullRequests({ q: qPrivKey });
              match = srch2.data.items?.[0];
            }

            let privateNum;
            if (match) {
              privateNum = match.number;
            } else {
              const created = await github.rest.issues.create({
                owner: privateOwner,
                repo: privateRepo,
                title: pubIssue.title,
                body: `${pubIssue.body || ''}\n\n${mirroredFrom}\n${mirrorKeyMarker}`
              });
              privateNum = created.data.number;
            }

            // Add backlink ONLY NOW (after mirror exists), against latest body
            const latestPub = await github.rest.issues.get({ owner: pubOwner, repo: pubRepo, issue_number: pubIssue.number });
            const existingBody = latestPub.data.body || '';
            const marker = mirroredTo(privateNum);
            if (!existingBody.includes(marker)) {
              const newBody = existingBody.includes(mirroredToPrefix)
                ? existingBody
                : `${existingBody}\n\n${marker}`;
              await github.rest.issues.update({
                owner: pubOwner,
                repo: pubRepo,
                issue_number: pubIssue.number,
                body: newBody
              });
            }

            core.setOutput('was_mirrored', 'true');
            core.setOutput('private_issue_number', String(privateNum));

      - name: Mark canonical in public (only if mirror exists and still open)
        if: >
          steps.mirror_to_private.outputs.was_mirrored == 'true' &&
          steps.mirror_to_private.outputs.private_issue_number != '' &&
          github.event.issue.state == 'open' &&
          !contains(join(github.event.issue.labels.*.name, ','), 'duplicate')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_MIRROR_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const num = context.payload.issue.number;
            const privateOwner = 'SteamifiedTesting';
            const privateRepo  = 'issue_private';

            // Verify a private mirror really exists before labeling
            const q = `repo:${privateOwner}/${privateRepo} is:issue in:body "mirrored-from: ${owner}/${repo}#${num}"`;
            const res = await github.rest.search.issuesAndPullRequests({ q });
            if (!res.data.items || res.data.items.length === 0) {
              core.info('LABEL: No private mirror found — skipping canonical label.');
              return;
            }

            try {
              await github.rest.issues.addLabels({ owner, repo, issue_number: num, labels: ['canonical'] });
            } catch {}
