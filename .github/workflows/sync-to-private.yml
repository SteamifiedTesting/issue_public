name: Sync updates to private (by type)

on:
  issues:
    types: [edited, labeled, unlabeled, reopened, closed, assigned, unassigned]

permissions:
  contents: read
  issues: write

env:
  ISSUE_TYPE_TO_MIRROR: "Epic"   # ✅ Edit this once to control type

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}

    steps:
      - name: Sync updates to private repo if type matches
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_MIRROR_TOKEN }}
          script: |
            const pubIssue = context.payload.issue;
            const pubOwner = context.repo.owner;
            const pubRepo  = context.repo.repo;
            const requiredType = process.env.ISSUE_TYPE_TO_MIRROR;

            // 1️⃣ Fetch Issue Type via GraphQL
            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    issueType { name }
                  }
                }
              }
            `;
            const res = await github.graphql(query, {
              owner: pubOwner,
              repo: pubRepo,
              number: pubIssue.number,
            });
            const issueTypeName = res.repository.issue?.issueType?.name || null;
            core.info(`🧩 Issue Type detected: ${issueTypeName}`);

            if (issueTypeName !== requiredType) {
              core.info(`⏭️ Not a ${requiredType} — skipping sync.`);
              return;
            }

            // 🪞 Proceed only if mirrored
            const body = pubIssue.body || '';
            const match = body.match(/<!--\s*mirrored-to:\s*([\w.-]+)\/([\w.-]+)#(\d+)\s*-->/i);
            if (!match) {
              core.info('No mirrored-to marker found; skipping.');
              return;
            }

            const [, privateOwner, privateRepo, privateNumStr] = match;
            const privateNum = parseInt(privateNumStr, 10);
            const newTitle = pubIssue.title;
            const labels   = (pubIssue.labels || []).map(l => typeof l === 'string' ? l : l.name);
            const newState = pubIssue.state;

            // 🧹 Prepare body
            const strippedBody = body.replace(/<!--\s*mirrored-to:[\s\S]*?-->/i, '').trim();
            const privateIssue = await github.rest.issues.get({ owner: privateOwner, repo: privateRepo, issue_number: privateNum });
            const privateBody = privateIssue.data.body || '';
            const fromMarker = (privateBody.match(/<!--\s*mirrored-from:[\s\S]*?-->/i) || [''])[0];
            const finalBody = `${strippedBody}\n\n${fromMarker}`.trim();

            // 🏷 Ensure labels exist
            const allPrivLabels = await github.paginate(github.rest.issues.listLabelsForRepo, { owner: privateOwner, repo: privateRepo, per_page: 100 });
            const privLabelNames = new Set(allPrivLabels.map(l => l.name));
            const missing = labels.filter(l => !privLabelNames.has(l));
            for (const name of missing) {
              try {
                await github.rest.issues.createLabel({ owner: privateOwner, repo: privateRepo, name });
              } catch (e) {
                core.warning(`Could not create label "${name}" in private: ${e.message}`);
              }
            }

            // ✏️ Update private issue
            await github.rest.issues.update({
              owner: privateOwner,
              repo: privateRepo,
              issue_number: privateNum,
              title: newTitle,
              body: finalBody,
              state: newState
            });

            // 🏷 Replace labels
            await github.rest.issues.setLabels({
              owner: privateOwner,
              repo: privateRepo,
              issue_number: privateNum,
              labels
            });

            core.info(`✅ Synced ${requiredType} changes from ${pubRepo}#${pubIssue.number} → ${privateRepo}#${privateNum}`);
